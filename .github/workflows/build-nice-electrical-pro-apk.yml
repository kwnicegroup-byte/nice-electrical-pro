name: Build NICE ELECTRICAL PRO Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - "v2/**"
      - ".github/workflows/build-nice-electrical-pro-apk.yml"

permissions:
  contents: read

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Install Capacitor dependencies
        working-directory: v2/native-wrapper
        run: npm install

      - name: Copy existing V2 app into Android package
        working-directory: v2/native-wrapper
        run: node copy-web.js

      - name: Generate Android project
        working-directory: v2/native-wrapper
        run: npx cap add android

      - name: Sync Android project
        working-directory: v2/native-wrapper
        run: npx cap sync android

      - name: Build debug APK
        working-directory: v2/native-wrapper/android
        run: ./gradlew assembleDebug

      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: nice-electrical-pro-v2-debug-apk
          path: v2/native-wrapper/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
