name: NICE ELECTRICAL PRO Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'v2/index.html'
      - 'v2/manifest.webmanifest'
      - 'v2/sw.js'
      - 'v2/native-wrapper/**'
      - '.github/workflows/nice-electrical-android.yml'

permissions:
  contents: read

jobs:
  build-android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: v2/native-wrapper
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install Capacitor dependencies
        run: npm install

      - name: Copy existing V2 web app
        run: npm run build

      - name: Add Android platform
        run: npx cap add android

      - name: Sync Android project
        run: npx cap sync android
      - name: Install native Android print bridge
        run: node install-native.js

      - name: Build debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: nice-electrical-pro-v2-android-debug
          path: v2/native-wrapper/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
